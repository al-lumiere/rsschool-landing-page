<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coffee House</title>
    <meta
      name="description"
      content="Coffee House — enjoy premium coffee at our charming cafe."
    />

    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/images/mobile_icon.png" />

    <link rel="stylesheet" href="./components/header/header.css" />
    <link rel="stylesheet" href="./components/footer/footer.css" />
    <link rel="stylesheet" href="./css/menu.css" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/typography.css" />

    <script src="./js/components.js" defer></script>
    <script src="./js/theme.js" defer></script>
    <script src="./components/header/header.js" defer></script>
    <script src="./js/menu.js" defer></script>
  </head>

  <body class="menuPage">
    <div id="header-container"></div>

    <main>
      <section class="menu">
        <h1 class="heading-2 menuTitle">
          Behind each of our cups<br />
          hides an <span class="accent">amazing surprise</span>
        </h1>

        <div class="categories">
          <button class="category linkButton active" type="button" data-category="coffee">
            <span class="categoryIcon">☕</span>
            Coffee
          </button>

          <button class="category linkButton" type="button" data-category="tea">
            <span class="categoryIcon">🫖</span>
            Tea
          </button>

          <button class="category linkButton" type="button" data-category="dessert">
            <span class="categoryIcon">🍰</span>
            Dessert
          </button>
        </div>

        <div class="menuGrid"></div>

        <button
          class="showMore"
          type="button"
          aria-label="Show more menu items"
        >
          <svg
            class="refreshIcon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </section>
    </main>

    <div id="footer-container"></div>
  </body>
</html>
